[project]
name = "itn"
version = "0.1.0"
description = "IsThisNormal ingestion, analysis, and publish pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
    "eyecite>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
itn = "itn.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["itn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
