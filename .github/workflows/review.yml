# Free: review packets for a stronger model working in a Claude session, and the import of
# its answers. Calls no model API; has no API key and does not use the `paid` environment.
# Packets are built by the data layer, so they hold nothing dated after each item's as-of
# date. Answers live in reviews/ next to the packets they answer.
name: Session review
on:
  workflow_dispatch:
    inputs:
      action:
        description: "export packets, import answers, or rescore (re-apply fixed rules to stored scores; the dry run only lists the changes)"
        type: choice
        options: [export, import, rescore, rescore-dry-run]
        default: export
      ids:
        description: "export: these artifact IDs instead of a selection (space separated)"
        required: false
      max_raw:
        description: "export: current raw score below this (0.6 = unusual or less normal)"
        default: "0.6"
      min_confidence:
        description: "export: or confidence below this"
        default: "0.75"
      type:
        description: "export: only this type"
        type: choice
        options: ["", scotus_case, public_law, executive_document]
      limit:
        description: "export: most packets"
        default: "100"
      sample:
        description: "export: a random spot check instead, this many items per type, any score"
        required: false
      batch:
        description: "batch name: export writes reviews/<batch>/packets.jsonl; import reads reviews/<batch>/"
        required: false

concurrency: analysis

# Export pushes packets to the branch review/<batch>. Answers are committed there too, and
# import is dispatched from that branch, so packets never land on main.
permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      IDS: ${{ inputs.ids }}
      TYPE: ${{ inputs.type }}
      BATCH: ${{ inputs.batch }}
      SAMPLE: ${{ inputs.sample }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - name: Export packets
        if: inputs.action == 'export'
        run: |
          case "$BATCH" in *[!A-Za-z0-9_-]*|"") echo "batch must be letters, digits, - or _"; exit 1;; esac
          args=(--max-raw "${{ inputs.max_raw }}" --min-confidence "${{ inputs.min_confidence }}"
                --limit "${{ inputs.limit }}" --out "reviews/$BATCH/packets.jsonl")
          [ -n "$IDS" ] && args+=(--ids $IDS)
          [ -n "$TYPE" ] && args+=(--type "$TYPE")
          case "$SAMPLE" in "") ;; *[!0-9]*) echo "sample must be a number"; exit 1;; *) args+=(--sample "$SAMPLE" --seed "$BATCH");; esac
          itn review export "${args[@]}"
      - name: Push packets to branch review/<batch>
        if: inputs.action == 'export'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "review/$BATCH"
          git add "reviews/$BATCH/packets.jsonl"
          git commit -m "Review packets: $BATCH"
          git push -f origin "review/$BATCH"
      - name: Import answers
        if: inputs.action == 'import'
        run: |
          case "$BATCH" in *[!A-Za-z0-9_-]*|"") echo "batch must be letters, digits, - or _"; exit 1;; esac
          itn review import --packets "reviews/$BATCH/packets.jsonl" --answers reviews/$BATCH/answers*.jsonl
      - name: Re-apply fixed rules to stored scores
        if: inputs.action == 'rescore'
        run: itn review rescore
      - name: List what re-applying the fixed rules would change
        if: inputs.action == 'rescore-dry-run'
        run: itn review rescore --dry-run
