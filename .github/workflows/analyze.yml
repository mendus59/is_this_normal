# Paid: spends model tokens, only in the `paid` environment, which is the only place
# ANTHROPIC_API_KEY exists. Runs when dispatched by hand, and once after each Ingest on
# main to score new entries: only items without a current score, economy profile (Haiku),
# capped at vars.AUTO_SCORE_BUDGET (default $1). Set vars.AUTO_SCORE to 'false' to stop it.
name: Analyze
on:
  workflow_run:
    workflows: [Ingest]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: "score items, or check how each citation is used (appropriate, stretch, improper)"
        type: choice
        options: [score, citations]
        default: score
      ids:
        description: "Artifact IDs, space separated (e.g. eo/14028 pl/117-169)"
        required: false
      type:
        description: "Or a whole type"
        type: choice
        options: ["", scotus_case, public_law, executive_document, action_event]
      years:
        description: "Year range, e.g. 2001-2004"
        required: false
      unscored:
        description: "Only artifacts without a current score (citations: only items with unchecked citations)"
        type: boolean
        default: true
      unreviewed:
        description: "Only items whose current score is the economy model's own (re-score after a wording change)"
        type: boolean
        default: false
      budget:
        description: "Hard spending cap in USD"
        required: true
        default: "5"
      max_tier:
        description: "Most capable model allowed"
        type: choice
        options: [haiku, sonnet, opus]
        default: sonnet
      dry_run:
        description: "Estimate cost only, call no model"
        type: boolean
        default: true
      pilot:
        description: "Score the 30 calibration anchors (ignores ids/type/years; citations: the ruling and executive anchors)"
        type: boolean
        default: false
      compare:
        description: "Trial run: results never become current scores (standard profile also uses the comparison settings)"
        type: boolean
        default: false
      profile:
        description: "standard, or economy (one Haiku pass per item, ~$10 for everything)"
        type: choice
        options: [standard, economy]
        default: standard

# Own queue: a pending data load must not cancel a pending analysis, and analysis
# writes only analysis, score and run rows.
concurrency: analysis

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || (vars.AUTO_SCORE != 'false' && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    environment: paid
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IDS: ${{ inputs.ids }}
      TYPE: ${{ inputs.type }}
      YEARS: ${{ inputs.years }}
      AUTO: ${{ github.event_name == 'workflow_run' }}
      AUTO_BUDGET: ${{ vars.AUTO_SCORE_BUDGET || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install ./pipeline
      - name: Apply database migrations
        if: ${{ github.event_name == 'workflow_run' || !inputs.dry_run }}
        run: itn migrate
      - name: Score new entries (automatic, after Ingest)
        if: ${{ github.event_name == 'workflow_run' }}
        run: itn analyze --unscored --profile economy --max-tier haiku --budget "$AUTO_BUDGET"
      - name: Run analysis
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--budget "${{ inputs.budget }}" --max-tier "${{ inputs.max_tier }}")
          citations=false
          [ "${{ inputs.task }}" = "citations" ] && citations=true && args+=(--citations)
          [ -n "$IDS" ] && args+=(--ids $IDS)
          [ -n "$TYPE" ] && args+=(--type "$TYPE")
          [ -n "$YEARS" ] && args+=(--years "$YEARS")
          if [ "${{ inputs.unscored }}" = "true" ]; then
            if $citations; then args+=(--unchecked); else args+=(--unscored); fi
          fi
          [ "${{ inputs.unreviewed }}" = "true" ] && args+=(--unreviewed)
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          [ "${{ inputs.pilot }}" = "true" ] && args+=(--pilot)
          [ "${{ inputs.compare }}" = "true" ] && args+=(--compare)
          args+=(--profile "${{ inputs.profile }}")
          itn analyze "${args[@]}"
      - name: Calibration report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.task != 'citations' }}
        run: itn calibration
