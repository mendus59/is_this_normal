# Calibration anchors: items most observers would place in the same band. Every rubric
# version is scored against these before a large paid run. These are also the pilot.
# Expected bands are proposals for review. An entry names an id, or a title fragment
# plus a year when the id is not known in advance (slip-opinion ids, FR doc numbers).
# `chain` groups same-actor items used to test the same-actor rule.
